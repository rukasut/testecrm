<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM · iCasas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0c0f16; --bg2:#12161f; --bg3:#1a1f2b; --border:#252b39; --border2:#39415a;
  --text:#e9edf5; --text2:#9aa3b8; --text3:#69718a;
  --azul:#3d7eff; --verde:#22c55e; --roxo:#a855f7; --ambar:#f59e0b; --vermelho:#ef4444; --teal:#14b8a6;
  --r:9px; --rl:13px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:14px}
.oculto{display:none!important}

/* ---------- LOGO ---------- */
.logo{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.logo svg{width:100%;height:100%;display:block}
.logo-p{width:34px;height:34px}
.logo-g{width:64px;height:64px}
.topo-marca{display:flex;align-items:center;gap:14px}

/* ---------- LOGIN ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.caixa-login{width:100%;max-width:380px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:34px 30px}
.marca{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;letter-spacing:.3px}
.marca span{color:var(--azul)}
.marca small{display:block;font-family:'DM Sans';font-weight:500;font-size:10px;color:var(--text3);letter-spacing:1.8px;text-transform:uppercase;margin-top:3px}
.campo{margin-top:16px}
.campo label{display:block;font-size:11.5px;color:var(--text3);margin-bottom:6px;letter-spacing:.3px}
.campo input,.campo select,.campo textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:10px 13px;color:var(--text);outline:none;transition:.15s}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--azul)}
.campo textarea{resize:vertical;min-height:74px}
.btn{border:none;border-radius:var(--r);padding:10px 16px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-p{background:var(--azul);color:#fff}
.btn-g{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.btn-d{background:transparent;color:var(--vermelho);border:1px solid var(--vermelho)}
.btn-sm{padding:7px 12px;font-size:12.5px}
.erro{color:var(--vermelho);font-size:12.5px;margin-top:12px;min-height:18px}

/* ---------- ESTRUTURA ---------- */
.topo{display:flex;align-items:center;gap:14px;padding:0 20px;height:56px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.abas{display:flex;gap:2px;padding:0 14px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto}
.aba{padding:11px 15px;font-size:13.5px;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.12s}
.aba:hover{color:var(--text2)}
.aba.on{color:var(--text);border-bottom-color:var(--azul);font-weight:600}
.pag{display:none;padding:22px 20px 60px}
.pag.on{display:block}
.dir{margin-left:auto;display:flex;align-items:center;gap:10px}
.sel-emp{background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:20px;padding:6px 13px;font-size:12.5px;outline:none;cursor:pointer}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--azul);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;cursor:pointer;flex-shrink:0}
.sair{font-size:12.5px;color:var(--text3);cursor:pointer}
.sair:hover{color:var(--text)}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:13px;margin-bottom:24px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px}
.kpi .n{font-family:'Syne',sans-serif;font-size:29px;font-weight:700;line-height:1}
.kpi .l{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-top:8px}

/* ---------- FILTROS ---------- */
.filtros{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filtros .campo{margin-top:0;min-width:140px}
.busca{position:relative;flex:1;min-width:190px;max-width:280px}
.busca input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:10px 13px;color:var(--text);outline:none}

/* ---------- TABELA ---------- */
.rolagem{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);font-weight:600;padding:0 12px 10px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text2)}
th .s{margin-left:5px;font-size:9px;opacity:.55}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg2)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 9px;border-radius:20px;white-space:nowrap}
.bola{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.vazio{color:var(--text3);font-size:13px;padding:26px 4px}

/* ---------- PIPELINE ---------- */
.pipe{display:flex;gap:13px;align-items:flex-start;overflow-x:auto;padding-bottom:12px}
.col{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);width:262px;flex-shrink:0;display:flex;flex-direction:column;max-height:calc(100vh - 250px)}
.col-cab{display:flex;align-items:center;gap:8px;padding:12px 13px;border-bottom:1px solid var(--border);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:600}
.col-cab .c{margin-left:auto;background:var(--bg3);color:var(--text3);font-size:10.5px;padding:2px 8px;border-radius:10px}
.col-corpo{padding:9px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.col.alvo{outline:2px dashed var(--azul);outline-offset:-4px}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:11px 12px;cursor:grab;transition:.12s}
.card:hover{border-color:var(--border2);transform:translateY(-1px)}
.card.arrastando{opacity:.4}
.card h4{font-size:13.5px;font-weight:500;line-height:1.35;margin-bottom:7px}
.card-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11px;color:var(--text3)}
.valor{font-weight:600;color:var(--verde);font-size:12px}

/* ---------- MODAL ---------- */
.fundo{position:fixed;inset:0;background:rgba(5,8,14,.75);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.fundo.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rl);width:560px;max-width:96vw;max-height:92vh;overflow-y:auto}
.modal-cab{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:2}
.modal-cab h3{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;flex:1}
.x{background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
.x:hover{color:var(--text)}
.modal-corpo{padding:20px 22px}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-pe{display:flex;gap:9px;padding:14px 22px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--bg2);justify-content:flex-end}
.modal-pe .btn-d{margin-right:auto}

/* ---------- AVISO ---------- */
#aviso{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--bg2);border:1px solid var(--border2);border-left:4px solid var(--verde);border-radius:10px;padding:12px 20px;font-size:13.5px;font-weight:500;z-index:99;opacity:0;transition:.25s;box-shadow:0 8px 26px rgba(0,0,0,.45)}
#aviso.on{transform:translateX(-50%) translateY(0);opacity:1}
#aviso.ruim{border-left-color:var(--vermelho)}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

@media(max-width:700px){
  .pag{padding:16px 12px 50px}
  .col{width:84vw}
  .linha2{grid-template-columns:1fr}
  .topo{padding:0 12px;gap:10px}
  .modal-pe{flex-wrap:wrap}
  .modal-pe .btn{flex:1}
}
</style>
</head>

<div id="login">
  <div class="caixa-login">
    <div class="topo-marca">
      <span class="logo logo-g" data-logo></span>
      <div class="marca">i<span>Casas</span><small>CRM Comercial</small></div>
    </div>
    <div class="campo">
      <label>E-mail</label>
      <input type="email" id="lgEmail" autocomplete="username" onkeydown="if(event.key==='Enter')entrar()">
    </div>
    <div class="campo">
      <label>Senha</label>
      <input type="password" id="lgSenha" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
    </div>
    <div class="erro" id="lgErro"></div>
    <button class="btn btn-p" style="width:100%;margin-top:6px" id="lgBtn" onclick="entrar()">Entrar</button>
    <div style="text-align:center;margin-top:14px">
      <span class="sair" onclick="recuperar()">Esqueci minha senha</span>

            <input type="checkbox" id="pfTodasEmp" style="width:auto"> Ver todas as empresas
          </label>

        <label>Trocar minha senha (deixe vazio para manter)</label>

      </div>

<div id="aviso"></div>

<script>
/* =====================================================================
   CONFIGURAÇÃO — trocar pelos dados do projeto Supabase
   Painel do Supabase → Settings → API
   ===================================================================== */
const SUPA_URL = 'https://SEU-PROJETO.supabase.co';
const SUPA_KEY = 'SUA-CHAVE-ANON-AQUI';

const db = window.supabase.createClient(SUPA_URL, SUPA_KEY);

/* ---------- constantes ---------- */
const EMPRESAS = [
  {id:'construtora', n:'iCasas Construtora', cor:'#3d7eff'},
  {id:'automacao',   n:'iCasas Automação',   cor:'#14b8a6'}
];
const ETAPAS = [
  {id:'novo',      n:'Novo lead',       cor:'#f59e0b'},
  {id:'contato',   n:'Contato feito',   cor:'#3d7eff'},
  {id:'proposta',  n:'Proposta enviada',cor:'#a855f7'},
  {id:'negociando',n:'Em negociação',   cor:'#14b8a6'},
  {id:'ganho',     n:'Fechado',         cor:'#22c55e'},
  {id:'perdido',   n:'Perdido',         cor:'#ef4444'},
  {id:'standby',   n:'Standby',         cor:'#69718a'}
];
const ORIGENS = ['instagram','facebook','whatsapp','site','feirao','google','indicacao','outros'];
const TEMPS = {quente:'#ef4444', morno:'#f59e0b', frio:'#3d7eff'};

/* ---------- estado ---------- */
let eu = null;          // meu perfil
let empresaAtiva = '';  // empresa sendo visualizada
let leads = [], equipe = [];
let editandoLead = null, editandoPerfil = null;
let ordem = {campo:'criado', desc:true};

/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}
function aviso(msg, ruim){
  const a=$('aviso'); a.textContent=msg; a.className='on'+(ruim?' ruim':'');
  clearTimeout(a._t); a._t=setTimeout(()=>a.className='',3200);
}
function etapa(id){return ETAPAS.find(e=>e.id===id)||{n:id||'—',cor:'#69718a'};}
function empresa(id){return EMPRESAS.find(e=>e.id===id)||{n:id||'—',cor:'#69718a'};}
function moeda(v){
  if(v==null||v==='')return '—';
  return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
}
function dataBr(d){ if(!d)return '—'; const x=new Date(d); return x.toLocaleDateString('pt-BR'); }
function podeAdmin(){ return eu && ['gestor','diretor'].includes(eu.cargo); }
function vejoTodasEmpresas(){ return !!(eu && eu.ver_todas_empresas); }

/* =====================================================================
   AUTENTICAÇÃO
   ===================================================================== */
async function entrar(){
  const email=$('lgEmail').value.trim(), senha=$('lgSenha').value;
  $('lgErro').textContent='';
  if(!email||!senha){ $('lgErro').textContent='Preencha e-mail e senha.'; return; }
  $('lgBtn').disabled=true; $('lgBtn').textContent='Entrando...';
  const {error}=await db.auth.signInWithPassword({email, password:senha});
  $('lgBtn').disabled=false; $('lgBtn').textContent='Entrar';
  if(error){ $('lgErro').textContent='E-mail ou senha incorretos.'; return; }
  iniciar();
}
async function recuperar(){
  const email=$('lgEmail').value.trim();
  if(!email){ $('lgErro').textContent='Digite seu e-mail para receber o link.'; return; }
  const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.href});
  $('lgErro').textContent = error ? 'Não foi possível enviar o link.' : '';
  if(!error) aviso('Link de recuperação enviado para o seu e-mail.');
}
async function sair(){ await db.auth.signOut(); location.reload(); }

async function iniciar(){
  const {data:{user}} = await db.auth.getUser();
  if(!user){ $('login').classList.remove('oculto'); $('app').classList.add('oculto'); return; }

  const {data:perfil, error} = await db.from('perfis').select('*').eq('id',user.id).maybeSingle();
  if(error || !perfil){
    $('lgErro').textContent='Seu usuário existe, mas não tem perfil vinculado. Peça ao gestor para vincular.';
    await db.auth.signOut();
    return;
  }
  eu = perfil;
  empresaAtiva = perfil.empresa;

  $('login').classList.add('oculto');
  $('app').classList.remove('oculto');
  $('avatar').textContent = (perfil.apelido||perfil.nome||'?').trim().charAt(0).toUpperCase();
  $('avatar').style.background = perfil.cor || 'var(--azul)';

  if(vejoTodasEmpresas()){
    const s=$('selEmpresa');
    s.innerHTML = '<option value="__todas">Todas as empresas</option>' +
      EMPRESAS.map(e=>`<option value="${e.id}">${e.n}</option>`).join('');
    s.value = perfil.empresa;
    s.classList.remove('oculto');
  }
  if(podeAdmin()) $('ab-equipe').classList.remove('oculto');

  montarSelects();
  await carregar();
}

/* =====================================================================
   CARREGAMENTO
   ===================================================================== */
function montarSelects(){
  const opEtapas = ETAPAS.map(e=>`<option value="${e.id}">${e.n}</option>`).join('');
  $('ldEtapa').innerHTML = opEtapas;
  $('fEtapa').innerHTML = '<option value="">Todas</option>'+opEtapas;

  const opOrigens = ORIGENS.map(o=>`<option value="${o}">${o}</option>`).join('');
  $('ldOrigem').innerHTML = '<option value="">Selecionar…</option>'+opOrigens;
  $('fOrigem').innerHTML = '<option value="">Todas</option>'+opOrigens;

  const opEmp = EMPRESAS.map(e=>`<option value="${e.id}">${e.n}</option>`).join('');
  $('ldEmpresa').innerHTML = opEmp;
  $('pfEmpresa').innerHTML = opEmp;
  if(vejoTodasEmpresas()) $('ldEmpWrap').classList.remove('oculto');
}

async function carregar(){
  // a RLS já limita o que volta; o filtro por empresa aqui é só de visualização
  let q = db.from('leads').select('*').order('criado',{ascending:false});
  if(empresaAtiva && empresaAtiva!=='__todas') q = q.eq('empresa', empresaAtiva);
  const {data:ls, error} = await q;
  if(error){ aviso('Erro ao carregar leads: '+error.message, true); return; }
  leads = ls||[];

  const {data:ps} = await db.from('perfis').select('*').order('nome');
  equipe = ps||[];

  const opVend = equipe.map(p=>`<option value="${p.id}">${esc(p.apelido||p.nome)}</option>`).join('');
  $('ldVend').innerHTML = '<option value="">Sem responsável</option>'+opVend;
  $('fVend').innerHTML  = '<option value="">Todos</option>'+opVend;

  desenhar();
}
async function trocarEmpresa(){
  empresaAtiva = $('selEmpresa').value;
  await carregar();
}

/* =====================================================================
   FILTROS E DESENHO
   ===================================================================== */
function filtrados(){
  const b=($('fBusca').value||'').toLowerCase();
  const e=$('fEtapa').value, v=$('fVend').value, o=$('fOrigem').value;
  return leads.filter(l=>{
    if(e && l.estagio!==e) return false;
    if(v && l.vendedor!==v) return false;
    if(o && l.origem!==o) return false;
    if(b){
      const alvo=[l.nome,l.telefone,l.email,l.campanha,l.observacoes].join(' ').toLowerCase();
      if(alvo.indexOf(b)<0) return false;
    }
    return true;
  });
}
function limparFiltros(){
  $('fBusca').value=''; $('fEtapa').value=''; $('fVend').value=''; $('fOrigem').value='';
  desenhar();
}
function nomeVend(id){
  const p=equipe.find(x=>x.id===id);
  return p?(p.apelido||p.nome):'—';
}
function corVend(id){
  const p=equipe.find(x=>x.id===id);
  return p&&p.cor?p.cor:'#69718a';
}

function desenhar(){ painel(); tabelaLeads(); pipeline(); if(podeAdmin()) tabelaEquipe(); }

function irPara(p){
  ['painel','leads','pipe','equipe'].forEach(x=>{
    $('pg-'+x).classList.toggle('on', x===p);
    $('ab-'+x).classList.toggle('on', x===p);
  });
}

/* ---------- PAINEL ---------- */
function painel(){
  const d=filtrados();
  const ganhos=d.filter(l=>l.estagio==='ganho');
  const total=ganhos.reduce((a,l)=>a+Number(l.valor||0),0);
  const ativos=d.filter(l=>['contato','proposta','negociando'].includes(l.estagio)).length;
  const conv=d.length?Math.round(ganhos.length/d.length*100):0;
  $('kpis').innerHTML =
    kpi(d.length,'Leads') +
    kpi(ganhos.length,'Fechados','var(--verde)') +
    kpi(ativos,'Em negociação','var(--azul)') +
    kpi(conv+'%','Conversão') +
    kpi(moeda(total),'Valor fechado','var(--verde)');

  $('porEtapa').innerHTML = ETAPAS.map(e=>{
    const n=d.filter(l=>l.estagio===e.id).length;
    return `<div class="kpi"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <span class="bola" style="background:${e.cor}"></span><b style="font-size:13px">${e.n}</b></div>
      <div class="n" style="font-size:23px">${n}</div></div>`;
  }).join('');

  // comparativo entre empresas — só para quem vê as duas
  const be=$('blocoEmpresas');
  if(vejoTodasEmpresas() && empresaAtiva==='__todas'){
    be.innerHTML = '<div style="font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--text3);margin:26px 0 12px;font-weight:600">Por empresa</div><div class="kpis">' +
      EMPRESAS.map(emp=>{
        const meus=d.filter(l=>l.empresa===emp.id);
        const g=meus.filter(l=>l.estagio==='ganho');
        const val=g.reduce((a,l)=>a+Number(l.valor||0),0);
        return `<div class="kpi">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span class="bola" style="background:${emp.cor}"></span><b style="font-size:13px">${emp.n}</b></div>
          <div class="n" style="font-size:23px">${meus.length}</div>
          <div class="l">leads · ${g.length} fechados · ${moeda(val)}</div></div>`;
      }).join('') + '</div>';
  } else be.innerHTML='';

  // ranking
  const porV={};
  d.forEach(l=>{ const k=l.vendedor||'—'; porV[k]=porV[k]||{n:0,g:0,v:0}; porV[k].n++;
    if(l.estagio==='ganho'){porV[k].g++; porV[k].v+=Number(l.valor||0);} });
  const linhas=Object.keys(porV).sort((a,b)=>porV[b].v-porV[a].v);
  $('tbRanking').innerHTML = linhas.length
    ? `<thead><tr><th>Vendedor</th><th>Leads</th><th>Fechados</th><th>Conversão</th><th>Valor</th></tr></thead><tbody>`+
      linhas.map(k=>{
        const r=porV[k];
        return `<tr><td><span class="bola" style="background:${corVend(k)};display:inline-block;margin-right:8px"></span>${esc(nomeVend(k))}</td>
          <td>${r.n}</td><td>${r.g}</td><td>${r.n?Math.round(r.g/r.n*100):0}%</td><td class="valor">${moeda(r.v)}</td></tr>`;
      }).join('')+'</tbody>'
    : '<tbody><tr><td class="vazio">Sem dados ainda.</td></tr></tbody>';
}
function kpi(n,l,cor){
  return `<div class="kpi"><div class="n"${cor?` style="color:${cor}"`:''}>${n}</div><div class="l">${l}</div></div>`;
}

/* ---------- TABELA DE LEADS ---------- */
const COLS=[['nome','Lead'],['telefone','Telefone'],['origem','Origem'],['vendedor','Vendedor'],
            ['estagio','Etapa'],['valor','Valor'],['criado','Entrada']];
function ordenar(c){
  if(ordem.campo===c) ordem.desc=!ordem.desc;
  else { ordem.campo=c; ordem.desc=(c==='valor'||c==='criado'); }
  tabelaLeads();
}
function valorOrd(l,c){
  if(c==='estagio') return ETAPAS.findIndex(e=>e.id===l.estagio);
  if(c==='vendedor') return nomeVend(l.vendedor).toLowerCase();
  if(c==='valor') return Number(l.valor||0);
  if(c==='criado') return l.criado||'';
  return String(l[c]||'').toLowerCase();
}
function tabelaLeads(){
  const d=filtrados().slice().sort((a,b)=>{
    const va=valorOrd(a,ordem.campo), vb=valorOrd(b,ordem.campo);
    let r = (typeof va==='number'&&typeof vb==='number') ? va-vb : String(va).localeCompare(String(vb),'pt-BR');
    return ordem.desc?-r:r;
  });
  const cab = COLS.map(([k,r])=>{
    const on=ordem.campo===k;
    return `<th onclick="ordenar('${k}')" ${on?'style="color:var(--azul)"':''}>${r}<span class="s">${on?(ordem.desc?'▾':'▴'):'⇅'}</span></th>`;
  }).join('');
  const mostraEmp = vejoTodasEmpresas() && empresaAtiva==='__todas';
  $('tbLeads').innerHTML = d.length
    ? `<thead><tr>${cab}${mostraEmp?'<th>Empresa</th>':''}</tr></thead><tbody>`+
      d.map(l=>{
        const e=etapa(l.estagio);
        return `<tr onclick="abrirLead('${l.id}')">
          <td><b style="font-weight:500">${esc(l.nome)}</b>
            ${l.temperatura?`<span class="bola" style="background:${TEMPS[l.temperatura]||'#69718a'};display:inline-block;margin-left:7px" title="${l.temperatura}"></span>`:''}</td>
          <td>${esc(l.telefone)}</td>
          <td>${esc(l.origem||'—')}</td>
          <td>${esc(nomeVend(l.vendedor))}</td>
          <td><span class="pill" style="background:${e.cor}22;color:${e.cor}">${e.n}</span></td>
          <td class="valor">${moeda(l.valor)}</td>
          <td>${dataBr(l.criado)}</td>
          ${mostraEmp?`<td><span class="pill" style="background:${empresa(l.empresa).cor}22;color:${empresa(l.empresa).cor}">${empresa(l.empresa).n}</span></td>`:''}
        </tr>`;
      }).join('')+'</tbody>'
    : '<tbody><tr><td class="vazio">Nenhum lead com esses filtros.</td></tr></tbody>';
}

/* ---------- PIPELINE ---------- */
function pipeline(){
  const d=filtrados();
  const alvo=$('pipe'); alvo.innerHTML='';
  ETAPAS.forEach(e=>{
    const meus=d.filter(l=>l.estagio===e.id);
    const soma=meus.reduce((a,l)=>a+Number(l.valor||0),0);
    const col=document.createElement('div'); col.className='col';
    col.innerHTML=`<div class="col-cab"><span class="bola" style="background:${e.cor}"></span>${e.n}
      <span class="c">${meus.length}</span></div>
      <div style="padding:0 13px 9px;font-size:11px;color:var(--text3)">${soma?moeda(soma):'—'}</div>
      <div class="col-corpo"></div>`;
    const corpo=col.querySelector('.col-corpo');
    meus.forEach(l=>corpo.appendChild(cardLead(l)));
    col.addEventListener('dragover',ev=>{ev.preventDefault();col.classList.add('alvo');});
    col.addEventListener('dragleave',()=>col.classList.remove('alvo'));
    col.addEventListener('drop',async ev=>{
      ev.preventDefault(); col.classList.remove('alvo');
      const id=ev.dataTransfer.getData('id');
      const l=leads.find(x=>x.id===id);
      if(!l||l.estagio===e.id)return;
      l.estagio=e.id; desenhar();
      const {error}=await db.from('leads').update({estagio:e.id}).eq('id',id);
      if(error){ aviso('Erro ao mover: '+error.message,true); carregar(); }
      else aviso(l.nome+' → '+e.n);
    });
    alvo.appendChild(col);
  });
}
function cardLead(l){
  const el=document.createElement('div'); el.className='card'; el.draggable=true;
  el.innerHTML=`<h4>${esc(l.nome)}</h4>
    <div class="card-meta">
      ${l.temperatura?`<span class="bola" style="background:${TEMPS[l.temperatura]||'#69718a'}"></span>`:''}
      <span>${esc(nomeVend(l.vendedor))}</span>
      ${l.valor?`<span class="valor" style="margin-left:auto">${moeda(l.valor)}</span>`:''}
    </div>
    ${l.origem?`<div class="card-meta" style="margin-top:6px"><span>${esc(l.origem)}${l.campanha?' · '+esc(l.campanha):''}</span></div>`:''}`;
  el.addEventListener('dragstart',ev=>{ev.dataTransfer.setData('id',l.id);el.classList.add('arrastando');});
  el.addEventListener('dragend',()=>el.classList.remove('arrastando'));
  el.addEventListener('click',()=>abrirLead(l.id));
  return el;
}

/* =====================================================================
   MODAL DE LEAD
   ===================================================================== */
function abrirLead(id){
  editandoLead = id || null;
  const l = id ? leads.find(x=>x.id===id) : null;
  $('mdLeadTit').textContent = l ? 'Editar lead' : 'Novo lead';
  $('ldNome').value = l?l.nome:'';
  $('ldTel').value = l?l.telefone:'';
  $('ldEmail').value = l&&l.email?l.email:'';
  $('ldEnd').value = l&&l.endereco?l.endereco:'';
  $('ldOrigem').value = l&&l.origem?l.origem:'';
  $('ldCampanha').value = l&&l.campanha?l.campanha:'';
  $('ldVend').value = l&&l.vendedor?l.vendedor:(eu?eu.id:'');
  $('ldEtapa').value = l?l.estagio:'novo';
  $('ldValor').value = l&&l.valor!=null?l.valor:'';
  $('ldTemp').value = l&&l.temperatura?l.temperatura:'morno';
  $('ldObs').value = l&&l.observacoes?l.observacoes:'';
  $('ldEmpresa').value = l&&l.empresa ? l.empresa
                        : (empresaAtiva&&empresaAtiva!=='__todas' ? empresaAtiva : (eu?eu.empresa:'construtora'));
  $('ldExcluir').style.display = (l && podeAdmin()) ? 'block' : 'none';
  $('mdLead').classList.add('on');
}
async function salvarLead(){
  const nome=$('ldNome').value.trim(), tel=$('ldTel').value.trim();
  if(!nome||!tel){ aviso('Nome e telefone são obrigatórios.',true); return; }
  const dados={
    nome, telefone:tel,
    email:$('ldEmail').value.trim()||null,
    endereco:$('ldEnd').value.trim()||null,
    origem:$('ldOrigem').value||null,
    campanha:$('ldCampanha').value.trim()||null,
    vendedor:$('ldVend').value||null,
    estagio:$('ldEtapa').value,
    valor:$('ldValor').value?Number($('ldValor').value):null,
    temperatura:$('ldTemp').value,
    observacoes:$('ldObs').value.trim()||null,
    empresa: vejoTodasEmpresas() ? $('ldEmpresa').value
             : (eu?eu.empresa:'construtora')
  };
  $('ldSalvar').disabled=true;
  const r = editandoLead
    ? await db.from('leads').update(dados).eq('id',editandoLead)
    : await db.from('leads').insert(dados);
  $('ldSalvar').disabled=false;
  if(r.error){ aviso('Erro ao salvar: '+r.error.message,true); return; }
  fechar('mdLead'); aviso('Lead salvo.'); carregar();
}
async function excluirLead(){
  if(!editandoLead) return;
  if(!confirm('Excluir este lead? Não tem como desfazer.')) return;
  const {error}=await db.from('leads').delete().eq('id',editandoLead);
  if(error){ aviso('Erro ao excluir: '+error.message,true); return; }
  fechar('mdLead'); aviso('Lead excluído.'); carregar();
}

/* =====================================================================
   EQUIPE E PERFIL
   ===================================================================== */
function tabelaEquipe(){
  $('tbEquipe').innerHTML = equipe.length
    ? `<thead><tr><th>Nome</th><th>Cargo</th><th>Empresa</th><th>Permissões</th><th>Meta</th><th>Status</th></tr></thead><tbody>`+
      equipe.map(p=>{
        const e=empresa(p.empresa);
        const perm=[p.ver_todos_leads?'todos os leads':'', p.ver_todas_empresas?'todas as empresas':'']
                    .filter(Boolean).join(' · ')||'padrão';
        return `<tr onclick="abrirPerfil('${p.id}')">
          <td><span class="bola" style="background:${p.cor||'#69718a'};display:inline-block;margin-right:8px"></span><b style="font-weight:500">${esc(p.nome)}</b></td>
          <td>${esc(p.cargo||'—')}</td>
          <td><span class="pill" style="background:${e.cor}22;color:${e.cor}">${e.n}</span></td>
          <td style="color:var(--text3);font-size:12.5px">${esc(perm)}</td>
          <td class="valor">${moeda(p.meta_mensal)}</td>
          <td>${p.ativo===false?'<span style="color:var(--vermelho)">inativo</span>':'<span style="color:var(--verde)">ativo</span>'}</td>
        </tr>`;
      }).join('')+'</tbody>'
    : '<tbody><tr><td class="vazio">Nenhum perfil vinculado.</td></tr></tbody>';
}
function abrirPerfilNovo(){
  editandoPerfil='__novo';
  $('mdPerfilTit').textContent='Vincular usuário';
  $('pfIdWrap').classList.remove('oculto');
  $('pfSenhaWrap').classList.add('oculto');
  $('pfId').value=''; $('pfNome').value=''; $('pfApelido').value=''; $('pfTel').value='';
  $('pfCor').value='#3d7eff'; $('pfCargo').value='vendedor';
  $('pfEmpresa').value = empresaAtiva&&empresaAtiva!=='__todas'?empresaAtiva:(eu?eu.empresa:'construtora');
  $('pfMeta').value=''; $('pfAtivo').value='true';
  $('pfTodosLeads').checked=false; $('pfTodasEmp').checked=false;
  $('pfAdmin').classList.toggle('oculto', !podeAdmin());
  $('mdPerfil').classList.add('on');
}
function abrirPerfil(id){
  const p = id ? equipe.find(x=>x.id===id) : eu;
  if(!p) return;
  editandoPerfil = p.id;
  const souEu = p.id===eu.id;
  $('mdPerfilTit').textContent = souEu?'Meu perfil':'Perfil de '+p.nome;
  $('pfIdWrap').classList.add('oculto');
  $('pfSenhaWrap').classList.toggle('oculto', !souEu);
  $('pfNome').value=p.nome||''; $('pfApelido').value=p.apelido||'';
  $('pfTel').value=p.telefone||''; $('pfCor').value=p.cor||'#3d7eff';
  $('pfCargo').value=p.cargo||'vendedor'; $('pfEmpresa').value=p.empresa||'construtora';
  $('pfMeta').value=p.meta_mensal!=null?p.meta_mensal:''; $('pfAtivo').value=String(p.ativo!==false);
  $('pfTodosLeads').checked=!!p.ver_todos_leads; $('pfTodasEmp').checked=!!p.ver_todas_empresas;
  $('pfSenha').value='';
  $('pfAdmin').classList.toggle('oculto', !podeAdmin());
  $('mdPerfil').classList.add('on');
}
async function salvarPerfil(){
  const nome=$('pfNome').value.trim();
  if(!nome){ aviso('O nome é obrigatório.',true); return; }
  const base={
    nome, apelido:$('pfApelido').value.trim()||null,
    telefone:$('pfTel').value.trim()||null, cor:$('pfCor').value
  };
  if(podeAdmin()){
    base.cargo=$('pfCargo').value;
    base.empresa=$('pfEmpresa').value;
    base.meta_mensal=$('pfMeta').value?Number($('pfMeta').value):null;
    base.ativo=$('pfAtivo').value==='true';
    base.ver_todos_leads=$('pfTodosLeads').checked;
    base.ver_todas_empresas=$('pfTodasEmp').checked;
  }
  let r;
  if(editandoPerfil==='__novo'){
    const uuid=$('pfId').value.trim();
    if(!uuid){ aviso('Cole o UUID do usuário criado no Supabase.',true); return; }
    r = await db.from('perfis').insert(Object.assign({id:uuid}, base));
  } else {
    r = await db.from('perfis').update(base).eq('id',editandoPerfil);
  }
  if(r.error){ aviso('Erro ao salvar: '+r.error.message,true); return; }

  // troca de senha só para o próprio usuário, via Auth
  const nova=$('pfSenha').value;
  if(nova && editandoPerfil===eu.id){
    if(nova.length<8){ aviso('A senha precisa de pelo menos 8 caracteres.',true); return; }
    const {error}=await db.auth.updateUser({password:nova});
    if(error){ aviso('Perfil salvo, mas a senha não trocou: '+error.message,true); }
    else aviso('Perfil e senha atualizados.');
  } else aviso('Perfil salvo.');

  fechar('mdPerfil');
  if(editandoPerfil===eu.id){ const {data}=await db.from('perfis').select('*').eq('id',eu.id).maybeSingle(); if(data)eu=data; }
  carregar();
}

/* ---------- geral ---------- */
function fechar(id){ $(id).classList.remove('on'); }
document.querySelectorAll('.fundo').forEach(f=>f.addEventListener('click',e=>{ if(e.target===f) f.classList.remove('on'); }));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.querySelectorAll('.fundo.on').forEach(f=>f.classList.remove('on')); });

// coloca a logo em todo elemento marcado com data-logo
(function(){
  const tpl=document.getElementById('tplLogo');
  document.querySelectorAll('[data-logo]').forEach(function(el){
    el.innerHTML = tpl.innerHTML;
  });
})();

iniciar();
</script>
